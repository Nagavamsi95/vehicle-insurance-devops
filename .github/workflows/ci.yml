  build-and-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image locally for scanning
        run: docker build -t vehicle-insurance:scan .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: vehicle-insurance:scan
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Push image to Docker Hub
        run: |
          docker tag vehicle-insurance:scan ${{ secrets.DOCKERHUB_USERNAME }}/vehicle-insurance:latest
          docker tag vehicle-insurance:scan ${{ secrets.DOCKERHUB_USERNAME }}/vehicle-insurance:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/vehicle-insurance:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/vehicle-insurance:${{ github.sha }}