name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

  build-and-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image locally for scanning
        run: docker build -t vehicle-insurance:scan .

      - name: Scan image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.0 image \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            --ignore-unfixed \
            vehicle-insurance:scan

      - name: Push image to Docker Hub
        run: |
          docker tag vehicle-insurance:scan ${{ secrets.DOCKERHUB_USERNAME }}/vehicle-insurance:latest
          docker tag vehicle-insurance:scan ${{ secrets.DOCKERHUB_USERNAME }}/vehicle-insurance:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/vehicle-insurance:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/vehicle-insurance:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy to server over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ec2-user
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/vehicle-insurance:latest
            sudo docker rm -f vehicle-insurance || true
            sudo docker run -d --restart always --name vehicle-insurance -p 80:5000 ${{ secrets.DOCKERHUB_USERNAME }}/vehicle-insurance:latest